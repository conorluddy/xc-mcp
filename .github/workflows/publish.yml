name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== lock.version || pkg.version !== lock.packages[''].version) {
            throw new Error('Package and lockfile versions must match');
          }
          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Release tag must be v${pkg.version}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test -- --watchman=false --runInBand
      
      - name: Build
        run: npm run build
      
      - name: Lint
        run: npm run lint

  publish:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== lock.version || pkg.version !== lock.packages[''].version) {
            throw new Error('Package and lockfile versions must match');
          }
          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Release tag must be v${pkg.version}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Publish to NPM - xc-mcp (primary)
        if: ${{ github.event_name == 'release' || github.event.inputs.dry_run == 'false' }}
        run: |
          echo "Publishing xc-mcp@${{ steps.version.outputs.version }}"
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Publish to NPM - xcmcp (alias)
        if: ${{ github.event_name == 'release' || github.event.inputs.dry_run == 'false' }}
        run: |
          echo "Publishing xcmcp@${{ steps.version.outputs.version }}"
          # Update package name for alias publish
          npm pkg set name=xcmcp
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Publish to NPM - xcode-mcp (alias)
        if: ${{ github.event_name == 'release' || github.event.inputs.dry_run == 'false' }}
        run: |
          echo "Publishing xcode-mcp@${{ steps.version.outputs.version }}"
          # Update package name for alias publish
          npm pkg set name=xcode-mcp
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Dry Run Summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "🚀 Dry run complete! Would have published:"
          echo "  - xc-mcp@${{ steps.version.outputs.version }}"
          echo "  - xcmcp@${{ steps.version.outputs.version }}"
          echo "  - xcode-mcp@${{ steps.version.outputs.version }}"
